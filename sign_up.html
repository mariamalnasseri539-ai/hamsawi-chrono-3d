<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up and Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #e0f7fa;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 400px;
            margin: 50px auto;
            padding: 20px;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        h2 {
            text-align: center;
            color: #006064;
        }
        form {
            display: flex;
            flex-direction: column;
        }
        label {
            margin: 10px 0 5px;
            color: #00796b;
        }
        input, select, button {
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        button {
            background-color: #00796b;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #004d40;
        }
        .error {
            color: red;
            font-size: 0.9em;
        }
        .actions {
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>
<body>
    <!-- Sign Up Page -->
    <div class="container" id="signUpPage">
        <h2>Sign Up</h2>
        <form id="signUpForm">
            <label for="fullName">Full Name</label>
            <input type="text" id="fullName" placeholder="Enter your full name">
            <span id="nameError" class="error"></span>

            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Enter your email">

            <label for="phone">Phone Number</label>
            <input type="text" id="phone" placeholder="Enter your phone number">
            <span id="phoneError" class="error"></span>

            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Enter your password">

            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword" placeholder="Confirm your password">
            <span id="passwordError" class="error"></span>

            <label for="userType">User Type</label>
            <select id="userType">
                <option value="">Select User Type</option>
                <option value="consumer">Consumer</option>
                <option value="seller">Seller</option>
                <option value="admin">Admin</option>
            </select>

            <label for="address">Address</label>
            <input type="text" id="address" placeholder="Enter your address">

            <label>
                <input type="checkbox" id="terms"> I agree to the terms and conditions
            </label>
            <span id="termsError" class="error"></span>

            <div class="actions">
                <button type="button" onclick="submitSignUp()">Sign Up</button>
                <button type="reset">Cancel</button>
            </div>
        </form>
    </div>

    <!-- Login Page -->
    <div class="container" id="loginPage" style="display:none;">
        <h2>Login</h2>
        <form id="loginForm">
            <label for="loginEmail">Email</label>
            <input type="email" id="loginEmail" placeholder="Enter your email">

            <label for="loginPassword">Password</label>
            <input type="password" id="loginPassword" placeholder="Enter your password">
            <span id="loginError" class="error"></span>

            <label for="loginUserType">User Type</label>
            <select id="loginUserType">
                <option value="">Select User Type</option>
                <option value="consumer">Consumer</option>
                <option value="seller">Seller</option>
                <option value="admin">Admin</option>
            </select>

            <button type="button" onclick="submitLogin()">Login</button>
        </form>
    </div>

    <script>
        let attempts = 0;
        let lockoutTime = null;

        function submitSignUp() {
            const name = document.getElementById('fullName').value;
            const phone = document.getElementById('phone').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const terms = document.getElementById('terms').checked;

            let valid = true;

            // Validate name
            if (!/^[a-zA-Z\sء-ي]+$/.test(name) || name.split(' ').length < 2) {
                document.getElementById('nameError').innerText = 'Please enter a valid full name.';
                valid = false;
            } else {
                document.getElementById('nameError').innerText = '';
            }

            // Validate phone
            if (!/^\d{7,15}$/.test(phone)) {
                document.getElementById('phoneError').innerText = 'Please enter a valid phone number.';
                valid = false;
            } else {
                document.getElementById('phoneError').innerText = '';
            }

            // Validate password
            if (password !== confirmPassword) {
                document.getElementById('passwordError').innerText = 'Passwords do not match.';
                valid = false;
            } else {
                document.getElementById('passwordError').innerText = '';
            }

            // Validate terms
            if (!terms) {
                document.getElementById('termsError').innerText = 'You must agree to the terms.';
                valid = false;
            } else {
                document.getElementById('termsError').innerText = '';
            }

            if (valid) {
                alert('Account created successfully!');
                document.getElementById('signUpForm').reset();
            }
        }

        function submitLogin() {
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            if (lockoutTime && new Date() < lockoutTime) {
                alert('Too many attempts. Try again later.');
                return;
            }

            if (email === 'user@example.com' && password === 'password123') {
                alert('Login successful!');
                attempts = 0;
            } else {
                attempts++;
                if (attempts >= 3) {
                    lockoutTime = new Date(new Date().getTime() + 10 * 60 * 1000);
                    alert('Too many attempts. You are locked out for 10 minutes.');
                } else {
                    alert('Invalid credentials. Please try again.');
                }
            }
        }
    </script>
</body>
</html>
