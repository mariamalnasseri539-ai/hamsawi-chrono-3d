<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart</title>
    <style>
      .cart-section {
            font-family: Arial, sans-serif;
            background-color: #e0f7fa;
            color: #006064;
            margin: 0;
            padding: 0;
        }
        .cart-section {
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        h2 {
            text-align: center;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }
        th, td {
            padding: 10px;
            text-align: center;
            border: 1px solid #ddd;
        }
        th {
            background-color: #b2ebf2;
        }
        button {
            padding: 5px 10px;
            background-color: #00796b;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #004d40;
        }
        .print-button, .submit-button {
            margin: 10px 0;
            display: inline-block;
            background-color: #0288d1;
        }
    </style>
</head>
<body>
    <section class="cart-section">
        <h2>My Cart</h2>
        <table id="cartTable">
            <thead>
                <tr>
                    <th>Product</th>
                    <th>Price</th>
                    <th>Unit</th>
                    <th>Size</th>
                    <th>Quantity</th>
                    <th>Total</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td contenteditable="true">Water</td>
                    <td class="price" data-unit="carton" data-size="small">2000</td>
                    <td>
                        <select class="unit-select">
                            <option value="carton">Carton</option>
                            <option value="bottle">Bottle</option>
                        </select>
                    </td>
                    <td>
                        <select class="size-select">
                            <option value="small">Small</option>
                            <option value="medium">Medium</option>
                            <option value="large">Large</option>
                        </select>
                    </td>
                    <td><input type="number" class="quantity" value="5" min="1"></td>
                    <td class="total">10000</td>
                    <td>
                        <button class="delete-button">Delete</button>
                    </td>
                </tr>
                <tr>
                    <td contenteditable="true">Water</td>
                    <td class="price" data-unit="carton" data-size="small">2000</td>
                    <td>
                        <select class="unit-select">
                            <option value="carton">Carton</option>
                            <option value="bottle">Bottle</option>
                        </select>
                    </td>
                    <td>
                        <select class="size-select">
                            <option value="small">Small</option>
                            <option value="medium">Medium</option>
                            <option value="large">Large</option>
                        </select>
                    </td>
                    <td><input type="number" class="quantity" value="5" min="1"></td>
                    <td class="total">10000</td>
                    <td>
                        <button class="delete-button">Delete</button>
                    </td>
                </tr>
                <tr>
                    <td contenteditable="true">Water</td>
                    <td class="price" data-unit="carton" data-size="small">2000</td>
                    <td>
                        <select class="unit-select">
                            <option value="carton">Carton</option>
                            <option value="bottle">Bottle</option>
                        </select>
                    </td>
                    <td>
                        <select class="size-select">
                            <option value="small">Small</option>
                            <option value="medium">Medium</option>
                            <option value="large">Large</option>
                        </select>
                    </td>
                    <td><input type="number" class="quantity" value="5" min="1"></td>
                    <td class="total">10000</td>
                    <td>
                        <button class="delete-button">Delete</button>
                    </td>
                </tr>
                <tr>
                    <td contenteditable="true">Water</td>
                    <td class="price" data-unit="carton" data-size="small">2000</td>
                    <td>
                        <select class="unit-select">
                            <option value="carton">Carton</option>
                            <option value="bottle">Bottle</option>
                        </select>
                    </td>
                    <td>
                        <select class="size-select">
                            <option value="small">Small</option>
                            <option value="medium">Medium</option>
                            <option value="large">Large</option>
                        </select>
                    </td>
                    <td><input type="number" class="quantity" value="5" min="1"></td>
                    <td class="total">10000</td>
                    <td>
                        <button class="delete-button">Delete</button>
                    </td>
                </tr>
            </tbody>
        </table>
        <button class="print-button" onclick="printCart()">Print Cart</button>
        <button class="submit-button" onclick="submitOrder()">Submit Order</button>
        <p>Please sign in to purchase</p>
    </section>

    <script>
        document.querySelectorAll('.quantity').forEach(input => {
            input.addEventListener('input', updateCart);
        });

        document.querySelectorAll('.unit-select').forEach(select => {
            select.addEventListener('change', updateUnit);
        });

        document.querySelectorAll('.size-select').forEach(select => {
            select.addEventListener('change', updateSize);
        });

        document.querySelectorAll('.delete-button').forEach(button => {
            button.addEventListener('click', confirmDelete);
        });

        function updateCart() {
            const row = this.closest('tr');
            const price = parseFloat(row.querySelector('.price').textContent);
            const quantity = parseInt(this.value);
            row.querySelector('.total').textContent = (price * quantity).toFixed(2);
        }

        function updateUnit() {
            const row = this.closest('tr');
            const priceCell = row.querySelector('.price');
            const unit = this.value;

            let newPrice = unit === 'carton' ? 2000 : 500;
            priceCell.textContent = newPrice;
            priceCell.setAttribute('data-unit', unit);

            const quantity = parseInt(row.querySelector('.quantity').value);
            row.querySelector('.total').textContent = (newPrice * quantity).toFixed(2);
        }

        function updateSize() {
            const row = this.closest('tr');
            const priceCell = row.querySelector('.price');
            const size = this.value;

            let sizeMultiplier = size === 'small' ? 1 : size === 'medium' ? 1.5 : 2;
            let basePrice = parseFloat(priceCell.getAttribute('data-unit') === 'carton' ? 2000 : 500);

            const newPrice = basePrice * sizeMultiplier;
            priceCell.textContent = newPrice;
            priceCell.setAttribute('data-size', size);

            const quantity = parseInt(row.querySelector('.quantity').value);
            row.querySelector('.total').textContent = (newPrice * quantity).toFixed(2);
        }

        function confirmDelete() {
            if (confirm('Are you sure you want to delete this item?')) {
                this.closest('tr').remove();
            }
        }

        function printCart() {
            const cartTable = document.getElementById('cartTable');
            const newWindow = window.open('', '_blank');
            newWindow.document.write('<html><head><title>Cart</title></head><body>');
            newWindow.document.write(cartTable.outerHTML);
            newWindow.document.write('</body></html>');
            newWindow.document.close();
            newWindow.print();
        }

        function submitOrder() {
            const rows = document.querySelectorAll('#cartTable tbody tr');
            const order = [];

            rows.forEach(row => {
                const product = row.querySelector('td[contenteditable="true"]').textContent;
                const price = row.querySelector('.price').textContent;
                const unit = row.querySelector('.unit-select').value;
                const size = row.querySelector('.size-select').value;
                const quantity = row.querySelector('.quantity').value;
                const total = row.querySelector('.total').textContent;

                order.push({ product, price, unit, size, quantity, total });
            });

            console.log('Order submitted:', order);
            alert('Your order has been submitted successfully!');
        }
    </script>
</body>
</html>
